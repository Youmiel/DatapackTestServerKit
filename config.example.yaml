# =============================================================================
#  Minecraft 多版本测试服务器部署工具 —— 配置文件
#  复制本文件为 config.yaml 后按需修改（工具默认读取 config.yaml）
# =============================================================================

# -----------------------------------------------------------------------------
#  Java 运行时探测
#  -----------------------------------------------------------------------------
#  说明：不同 MC 版本要求的 Java 不同（1.20.x 需 Java 17，1.20.5+/1.21 需 21…）。
#  本工具在 deploy 时**自动推断**该 MC 版本官方要求的 Java（查询 Mojang 官方
#  数据，无需人工维护映射），探测并固定路径，后续启动始终用该路径。
#
#  探测/选择顺序：
#    1) 下方 launcher_roots 里的 MC 官方启动器 runtime 目录 —— 优先精确定位
#       与该版本官方要求同名的 java-runtime-<component>（如 delta/gamma）
#    2) 环境变量 JAVA_HOME（use_env_fallback=true 时）
#    3) 系统 PATH 中的 java（use_env_fallback=true 时）
#  launcher_roots 可留空 [] —— 此时仅靠 JAVA_HOME / PATH。
#  装了 MC 官方启动器的用户建议填 runtime 目录（含各版本官方运行时，最省心）：
#    - Windows 常见: C:/Program Files (x86)/Minecraft Launcher/runtime
#                   或 %APPDATA%/.minecraft/runtime
#    - Linux/macOS 常见: ~/.minecraft/runtime
#  若本机没有该版本所需 Java（无论是否配了 preferred_major），deploy 会明确
#  报错并列出可用 Java，不会默默用错版本导致服务端启动失败。
#  自动推断结果会缓存到 .cache/（24h），离线可复用。
java:
  # MC 官方启动器的 runtime 目录（可多个；留空则仅靠 JAVA_HOME / PATH）
  launcher_roots:
    - "C:/Program Files (x86)/Minecraft Launcher/runtime"

  # 是否允许回退到 JAVA_HOME / PATH 探测。默认 true
  use_env_fallback: true

# -----------------------------------------------------------------------------
#  网络下载
# -----------------------------------------------------------------------------
network:
  # 下载超时（秒）
  timeout: 60
  # 可选：代理，如 http://127.0.0.1:7890 （留空则直连）
  proxy: ""
  # 是否做“内容校验”（默认 true）。开启时会：
  #   - mod：用 Modrinth/CurseForge 给出的 sha1 校验下载结果；复用共享缓存或
  #          实例已有文件时本地重算 sha1 比对（不联网）
  #   - MCDR 插件：用 HTTP HEAD 取 ETag/Last-Modified/Content-Length 与记录比对，
  #          判断共享缓存是否失效（不下载内容）；探测不到时沿用缓存、不阻塞部署
  # 关闭后退化为“文件存在且非空即复用”。
  verify_sha1: true
  # 每个请求/下载失败的**整体重试次数**（含首次），默认 3 = 失败后重试 2 次。
  # 连接层对 5xx/429 会先自动重试；此处兜底断流/超时等整体失败，并间隔退避。
  download_retries: 3

# -----------------------------------------------------------------------------
#  Modrinth API
#  -----------------------------------------------------------------------------
#  无需 key，但官方要求提供有辨识度的 User-Agent。改成你的标识。
modrinth:
  user_agent: "datapack-tester/0.1 (mc-multiversion-deployer)"

# -----------------------------------------------------------------------------
#  CurseForge API
#  -----------------------------------------------------------------------------
#  需要 API key。出于安全，key 不写在本文件里，而是通过环境变量提供：
#  工具会读取 curseforge.api_key_env 指定的环境变量名。
curseforge:
  # 环境变量名（不是 key 本身）。例：$env:CURSEFORGE_API_KEY = "....."
  api_key_env: "CURSEFORGE_API_KEY"

# -----------------------------------------------------------------------------
#  MCDR (MCDReforged) 全局设置
#  -----------------------------------------------------------------------------
#  MCDR 用 pip 安装到本项目共享 venv（只装一次），每个服务器实例各自
#  拥有独立的 MCDR 运行目录（config.yml / plugins/ 等彼此隔离）。
mcdr:
  # pip 安装 MCDR 时的版本约束；留空 = 最新稳定 2.x
  pip_spec: "mcdreforged>=2.0"
  # MCDR 界面语言：en_us / zh_cn / zh_tw
  language: "zh_cn"

# -----------------------------------------------------------------------------
#  服务器端口 / 游戏模式 / RCON 设置（可选）
#  -----------------------------------------------------------------------------
#  游戏端口、默认游戏模式与 RCON 的统一配置。部署（deploy）时自动应用；部署完
#  后也可随时用 `mcserver configure-server`（旧名 set-ports 仍可用）冷修改（不
#  重启服务端也能改，重启后生效）。
#
#  游戏模式 gamemode：写入 server.properties 的 gamemode。
#    MC 默认是 survival（生存），但本工具用于**测试数据包**，故**默认 creative**
#    （创造，方便搭环境/看效果）。想改可：
#      - 顶层这里改成其它值（survival/creative/adventure/spectator 或 0-3）
#      - 或只在某组下加同级 server: 块覆盖（组内所有实例生效）
#
#  RCON 需要同时配置两侧并保持一致：
#    - MC 服务端：server.properties 的 enable-rcon / rcon.port / rcon.password
#    - MCDR 侧   ：MCDR 作为 RCON 客户端连接服务端（config.yml 的 rcon 段）
#  本工具会同时写入并保持两边一致。
#
#  注：每组实例默认统一用这套设置（一次只开一个实例，端口不冲突）；
#      如需某组单独覆盖，可在该组下加同级 server: 块。
server:
  # 游戏端口（server-port）
  port: 25565
  # 默认游戏模式（gamemode）：survival/creative/adventure/spectator（或 0-3）
  gamemode: creative
  rcon:
    enable: false          # 是否启用 RCON
    port: 25575            # RCON 端口
    password: ""           # RCON 密码。启用时建议设置（留空则用默认 "password"）
    # address: 127.0.0.1   # RCON 地址（MCDR 连接用，一般不用改）

  # -------------------------------------------------------------------
  #  MCDR 启动命令模板（可选，一般不用配）
  #  -------------------------------------------------------------------
  #  不配时默认：java -Xms1G -Xmx2G -Dfile.encoding=UTF-8 ... -jar {jar} nogui
  #  需要自定义内存/JVM 参数时可在此给整条命令模板（shell 字符串），占位符：
  #    {java} - 自动探测到的 java 绝对路径（渲染时自动加引号，含空格安全）
  #    {jar}  - 服务器 jar 文件名（minecraft_server.jar）
  #  示例（调内存 + GC + 额外系统属性）：
  #  start_command_template: '"{java}" -Xms2G -Xmx4G -XX:+UseG1GC -Dfoo=bar -jar {jar} nogui'
  #  注意：模板是 shell 命令串，含特殊字符需自行按 shell 规则处理；
  #  组级也可在同组下加 server: 覆盖此模板。
  start_command_template: ""

# -----------------------------------------------------------------------------
#  MCDR 插件（全局默认，可选）
#  -----------------------------------------------------------------------------
#  所有组默认共用的 MCDR 插件。组级 plugins 与之**合并**（规则见下），
#  因此通用插件（如备份插件）只需在这里写一次，不必每组重复。
#
#  字段：
#    id  : 插件标识（仅展示/记录用）
#    url : 插件文件直链（GitHub release asset 等）
#  插件官方目录 https://mcdreforged.com/en/plugins 可查各插件 release 直链。
#
#  默认留空；需要时按下面示例填：
plugins: []
# plugins:
#   - id: quick_backup_multi
#     url: "https://github.com/TISUnion/QuickBackupM/releases/download/v1.10.1/QuickBackupM-v1.10.1.mcdr"

# -----------------------------------------------------------------------------
#  服务器版本组（核心配置）
#  -----------------------------------------------------------------------------
#  每个组 = 一个大版本线，组内共享：mod 列表、Java 要求（插件见上方顶层 plugins）。
#  组下的 instances 列出要部署的具体小版本 —— 每个小版本生成一个独立服务器。
#  「版本数量可通过增删 instances 或整个组来调整」。
#
#  目录布局（每个小版本实例一个目录，均为自包含 MCDR 根）：
#    servers/<版本>/
#      config.yml            <- MCDR 配置（自动生成，exec 模式启动 java）
#      .deploy-meta.json     <- 工具记录的部署元数据（loader 版本 / mod sha1）
#      plugins/              <- MCDR 插件（显式 URL 下载）
#      start.bat / start.sh  <- 一键前台启动 MCDR
#      server/               <- MCDR working_directory（服务器文件）
#        minecraft_server.jar  <- fabric server jar（含 loader，可直接启动）
#        mods/                 <- fabric mod（来自 Modrinth/CurseForge）
#        libraries/            <- fabric 依赖库（默认链接到 .cache/libraries 共享）
#        server.properties / eula.txt / world/  <- 首次启动自动生成
#        world/datapacks/      <- 你手动放数据包的地方
#
#  跨实例共享缓存 .cache/（详见 docs/configuration.md）：
#    plugins/       MCDR 插件（一次下载，多实例复制）
#    mods/          fabric mod（按文件名共享，跨组复用）
#    libraries/     fabric 依赖库（各实例 server/libraries 链接至此，省磁盘）
#    mojang_java/   各 MC 版本 Java 要求（24h TTL）
# =============================================================================
version_groups:
  # ---------------------------------------------------------------
  # 示例组 1：1.21 线
  # ---------------------------------------------------------------
  - id: "1.21"                       # 组标识（仅用于组织，可自定义）
    # 组内要部署的小版本（每个都创建一个独立服务器）
    instances: ["1.21.1", "1.21.4"]
    # 可选：本组 java 设置。默认可不配 —— 工具会按各 MC 版本自动推断所需 Java
    #（查 Mojang 官方数据）。只有想强制指定某大版本 Java 时才填 preferred_major。
    java:
      # launcher_roots: []          # 可选：本组追加的启动器目录
      # preferred_major: 21         # 可选：强制要求 Java 大版本（一般不填）
    # 本组所有实例要安装的 fabric mod（可留空）
    #   id     : Modrinth 项目 slug（或 CurseForge 项目 slug）
    #   source : modrinth | curseforge
    #   version: 可选。留空 = 自动选该 MC 版本下最新 fabric 兼容版
    #            Modrinth 可用 version_id 锁定；CurseForge 可用 fileId 锁定
    mods: []
    # 本组独有的 MCDR 插件（可留空）。通用插件建议写在上方顶层 plugins，
    # 这里只写差异（合并规则）：
    #   - 覆盖全局插件：只写 id（沿用全局 url）或 id + url（换源）
    #   - 排除全局插件：{id: 插件id, disabled: true}
    #   - 追加本组插件：新 id + url
    plugins: []

  # ---------------------------------------------------------------
  # 示例组 2：1.20 线 —— 含如何填 mod/插件示例
  # ---------------------------------------------------------------
  - id: "1.20"
    instances: ["1.20.1"]
    # java: {}   # 可不配：1.20.1 会自动推断为 Java 17 (java-runtime-gamma)
    # --- fabric mod 示例（Modrinth） ---
    # mods:
    #   - id: carpet              # https://modrinth.com/mod/carpet 的 slug
    #     source: modrinth
    #   - id: fabric-api          # 很多 mod 的前置
    #     source: modrinth
    #   # --- CurseForge 示例（需要 api_key） ---
    #   - id: some-cf-mod
    #     source: curseforge
    mods: []
    # --- 组级插件示例（与顶层 plugins 合并）---
    # plugins:
    #   - id: quick_backup_multi       # 顶层已有同名 → 覆盖（此处换成别的 release）
    #     url: "https://github.com/TISUnion/QuickBackupM/releases/download/v1.11.0/QuickBackupM-v1.11.0.mcdr"
    #   - id: some_other_plugin        # 顶层没有 → 追加为本组独有
    #     url: "https://example.com/some_other_plugin.mcdr"
    # 只想排除某个全局插件时：
    # plugins:
    #   - {id: quick_backup_multi, disabled: true}
    plugins: []
